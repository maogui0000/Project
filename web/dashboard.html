<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>照護者資訊後台 | 智慧長照關懷系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    * { font-family: 'Noto Sans TC', sans-serif; }
    body { background: #0f172a; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; }
    .nav-item { transition: all 0.2s; border-radius: 0.5rem; }
    .nav-item:hover { background: #334155; }
    .nav-item.active { background: #065f46; color: #6ee7b7; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .timeline-dot { width: 12px; height: 12px; border-radius: 50%; }
  </style>
</head>
<body class="min-h-screen text-slate-100">

<!-- Auth Gate: 未登入時顯示 -->
<div id="dashAuthGate" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center px-4">
  <div class="text-center max-w-sm w-full">
    <img src="images/blind.jpg" alt="Logo" class="h-36 mx-auto mb-4 object-contain" onerror="this.style.display='none'">
    <h2 class="text-xl font-bold text-white mb-2">照護者資訊後台</h2>
    <p class="text-sm text-slate-400 mb-6">請輸入慣稱和 PIN 碼登入</p>
    <div class="space-y-3">
      <input id="dash_pin_nickname" type="text" placeholder="慣稱（如：阿香婆婆）" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 text-sm text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none">
      <input id="dash_pin_code" type="password" inputmode="numeric" maxlength="6" placeholder="PIN 碼" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 text-sm text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none">
      <p id="dash_pin_error" class="text-red-400 text-xs hidden"></p>
      <button onclick="dashVerifyPin()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold transition">登入</button>
    </div>
    <p class="text-xs text-slate-500 mt-4">還沒註冊？請先到語音互動頁面完成註冊</p>
  </div>
</div>

<!-- Top Bar -->
<nav class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-700/60 px-4 py-3">
  <div class="max-w-screen-xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="images/blind.jpg" alt="Logo" class="h-24 w-auto object-contain" onerror="this.style.display='none'">
      <div class="border-l border-slate-700 pl-3">
        <div class="text-sm font-bold text-white leading-none">智慧長照關懷系統</div>
        <div class="text-xs text-slate-400 mt-0.5">照護者資訊後台</div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="topElderName" class="text-sm text-cyan-400 font-bold"></span>
      <button id="hamburgerBtn" class="lg:hidden w-8 h-8 flex items-center justify-center text-slate-300" onclick="toggleSidebar()">☰</button>
    </div>
  </div>
</nav>

<!-- Layout: Sidebar + Main -->
<div class="max-w-screen-xl mx-auto flex">
  <!-- Sidebar Navigation -->
  <aside id="sidebar" class="hidden lg:flex flex-col w-56 min-h-[calc(100vh-56px)] border-r border-slate-700/60 p-3 gap-1 sticky top-14">
    <a href="#home" class="nav-item px-3 py-2.5 flex items-center gap-2 text-sm text-slate-300" data-page="home">🏠 首頁總覽</a>
    <a href="#profile" class="nav-item px-3 py-2.5 flex items-center gap-2 text-sm text-slate-300" data-page="profile">👤 長者資料</a>
    <a href="#summary" class="nav-item px-3 py-2.5 flex items-center gap-2 text-sm text-slate-300" data-page="summary">📋 每日摘要</a>
    <a href="#emotion" class="nav-item px-3 py-2.5 flex items-center gap-2 text-sm text-slate-300" data-page="emotion">😊 情緒趨勢</a>
    <a href="#stats" class="nav-item px-3 py-2.5 flex items-center gap-2 text-sm text-slate-300" data-page="stats">📊 互動統計</a>
    <a href="#timeline" class="nav-item px-3 py-2.5 flex items-center gap-2 text-sm text-slate-300" data-page="timeline">⏱️ 事件時間軸</a>
    <a href="#reminders" class="nav-item px-3 py-2.5 flex items-center gap-2 text-sm text-slate-300" data-page="reminders">🔔 提醒事項</a>
    <div class="flex-1"></div>
    <a href="#settings" class="nav-item px-3 py-2.5 flex items-center gap-2 text-sm text-slate-300" data-page="settings">⚙️ 設定</a>
  </aside>

  <!-- Main Content -->
  <main id="mainContent" class="flex-1 p-4 sm:p-6 min-h-[calc(100vh-56px)]">
    <div id="pageContainer" class="fade-in"></div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════
// Auth Gate
// ═══════════════════════════════════════════════════════
const savedElderId = localStorage.getItem('active_elder_id');
const savedToken = localStorage.getItem('session_token');

if (savedElderId) {
  // 已登入，隱藏 auth gate
  document.getElementById('dashAuthGate').classList.add('hidden');
}

async function dashVerifyPin() {
  const nickname = document.getElementById('dash_pin_nickname').value.trim();
  const pin = document.getElementById('dash_pin_code').value.trim();
  const errorEl = document.getElementById('dash_pin_error');
  errorEl.classList.add('hidden');

  if (!nickname || !pin) { errorEl.textContent = '請輸入慣稱和 PIN 碼'; errorEl.classList.remove('hidden'); return; }

  try {
    const res = await fetch('/api/elder/verify_pin', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({nickname, pin}) });
    const data = await res.json();
    if (res.ok && data.success) {
      localStorage.setItem('active_elder_id', data.elder_id);
      localStorage.setItem('elder_nickname', nickname);
      localStorage.setItem('session_token', data.token || '');
      document.getElementById('dashAuthGate').classList.add('hidden');
      location.reload();
    } else {
      if (res.status === 423) {
        errorEl.textContent = '⚠️ PIN 碼錯誤次數過多，帳號已鎖定 15 分鐘';
        errorEl.style.color = '#f97316';
      } else {
        errorEl.textContent = data.detail || '慣稱或 PIN 碼錯誤';
      }
      errorEl.classList.remove('hidden');
    }
  } catch(e) { errorEl.textContent = '驗證失敗'; errorEl.classList.remove('hidden'); }
}

// ═══════════════════════════════════════════════════════
// 全域狀態
// ═══════════════════════════════════════════════════════
let elderData = null;
const elderId = localStorage.getItem('active_elder_id') || 'elder_178546685908e66b';
const elderToken = localStorage.getItem('session_token') || '';

// ═══════════════════════════════════════════════════════
// 資料載入
// ═══════════════════════════════════════════════════════
async function loadData() {
  try {
    const res = await fetch(`/api/elder/${elderId}`, {
      headers: elderToken ? { 'Authorization': `Bearer ${elderToken}` } : {}
    });
    if (!res.ok) throw new Error('API error');
    elderData = await res.json();
    document.getElementById('topElderName').textContent = elderData.personal_info?.nickname || '';
    renderCurrentPage();
  } catch(e) {
    document.getElementById('pageContainer').innerHTML = `<div class="card p-6 text-center"><p class="text-slate-400">無法載入資料</p><p class="text-xs text-slate-500 mt-2">${e.message}</p></div>`;
  }
}

// ═══════════════════════════════════════════════════════
// Router
// ═══════════════════════════════════════════════════════
function renderCurrentPage() {
  const hash = location.hash || '#home';
  const pages = { '#home': renderHome, '#profile': renderProfile, '#summary': renderSummary, '#emotion': renderEmotion, '#stats': renderStats, '#timeline': renderTimeline, '#reminders': renderReminders, '#settings': renderSettings };
  const fn = pages[hash] || renderHome;
  fn();
  // 更新 nav active
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('href') === hash);
  });
}
window.addEventListener('hashchange', renderCurrentPage);

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('hidden');
  sb.classList.toggle('fixed');
  sb.classList.toggle('inset-0');
  sb.classList.toggle('z-40');
  sb.classList.toggle('bg-slate-900');
  sb.classList.toggle('pt-16');
}

// ═══════════════════════════════════════════════════════
// Page: 首頁總覽
// ═══════════════════════════════════════════════════════
function renderHome() {
  if (!elderData) return;
  const s = elderData.today_summary || {};
  const m = s.metrics || {};
  const stats = elderData.interaction_stats || {};
  const medStatus = m.medication_taken ? '✓ 已服藥' : '⏳ 待確認';
  const medColor = m.medication_taken ? 'text-emerald-400' : 'text-amber-400';
  const emotion = m.emotion || '未檢測';
  const emotionIcon = {'開心':'😊','難過':'😢','生氣':'😠','中立':'😐','未檢測':'🔍'}[emotion] || '🔍';

  document.getElementById('pageContainer').innerHTML = `
    <h2 class="text-lg font-bold mb-4">📋 今日總覽</h2>
    <div class="card p-4 mb-4"><p class="text-sm text-slate-300">${s.text || '今天還沒有互動紀錄'}</p></div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      <div class="card p-4 text-center"><div class="text-2xl mb-1">💊</div><div class="text-xs text-slate-400">用藥</div><div class="text-sm font-bold ${medColor}">${medStatus}</div></div>
      <div class="card p-4 text-center"><div class="text-2xl mb-1">${emotionIcon}</div><div class="text-xs text-slate-400">情緒</div><div class="text-sm font-bold text-cyan-400">${emotion}</div></div>
      <div class="card p-4 text-center"><div class="text-2xl mb-1">💬</div><div class="text-xs text-slate-400">互動</div><div class="text-sm font-bold text-white">${stats.total_turns || 0} 次</div></div>
      <div class="card p-4 text-center"><div class="text-2xl mb-1">📡</div><div class="text-xs text-slate-400">LINE</div><div class="text-sm font-bold ${elderData.line_notification_status?.is_sent ? 'text-emerald-400' : 'text-slate-500'}">${elderData.line_notification_status?.is_sent ? '已推播' : '未推播'}</div></div>
    </div>
    ${(!m.medication_taken && stats.total_turns > 0) ? '<div class="card p-3 border-amber-500/50 bg-amber-500/10 mb-4"><span class="text-amber-300 text-sm font-bold">⚠️ 今日尚未確認服藥</span></div>' : ''}
    ${(emotion === '難過' || emotion === '生氣') ? '<div class="card p-3 border-red-500/50 bg-red-500/10 mb-4"><span class="text-red-300 text-sm font-bold">⚠️ 長者情緒低落，建議關心</span></div>' : ''}
  `;
}

// ═══════════════════════════════════════════════════════
// Page: 長者資料
// ═══════════════════════════════════════════════════════
function renderProfile() {
  if (!elderData) return;
  const p = elderData.personal_info || {};
  const ec = elderData.emergency_contact || {};
  const med = elderData.medical_safety || {};
  const phy = elderData.physical_care || {};
  const men = elderData.mental_cognitive || {};

  const field = (label, val, key) => `<div class="flex justify-between py-1.5 border-b border-slate-700/50"><span class="text-xs text-slate-400">${label}</span><span class="text-sm text-white">${val || '<span class=text-slate-500>尚未填寫</span>'}</span></div>`;

  document.getElementById('pageContainer').innerHTML = `
    <h2 class="text-lg font-bold mb-4">👤 長者資料 <button onclick="openEditModal()" class="text-xs px-2 py-1 rounded bg-cyan-600 text-white ml-2">✏️ 編輯</button></h2>
    <div class="card p-4 mb-3"><h3 class="text-sm font-bold text-cyan-400 mb-2">個人資訊</h3>
      ${field('姓名', p.name)}${field('暱稱', p.nickname)}${field('性別', p.gender==='male'?'男':'女')}${field('年齡', p.age)}${field('居住地', p.location)}
    </div>
    <div class="card p-4 mb-3"><h3 class="text-sm font-bold text-cyan-400 mb-2">緊急聯絡人</h3>
      ${field('姓名', ec.name)}${field('關係', ec.relationship)}${field('電話', ec.phone)}
    </div>
    <div class="card p-4 mb-3"><h3 class="text-sm font-bold text-cyan-400 mb-2">醫療安全</h3>
      ${field('慢性疾病', (med.chronic_diseases||[]).join('、'))}${field('目前用藥', (med.current_medications||[]).join('、'))}${field('藥物過敏', (med.drug_allergies||[]).join('、'))}${field('食物過敏', (med.food_allergies||[]).join('、'))}
    </div>
    <div class="card p-4 mb-3"><h3 class="text-sm font-bold text-cyan-400 mb-2">身體照護</h3>
      ${field('行動能力', phy.mobility)}${field('飲食禁忌', (phy.dietary_restrictions||[]).join('、'))}
    </div>
    <div class="card p-4"><h3 class="text-sm font-bold text-cyan-400 mb-2">認知狀態</h3>
      ${field('失智症', men.has_dementia ? '是' : '否')}${field('照護備註', men.cognitive_notes)}
    </div>
    <!-- 編輯 Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
      <div class="bg-slate-800 rounded-xl p-5 w-full max-w-md max-h-[80vh] overflow-y-auto">
        <h3 class="text-base font-bold text-white mb-4">編輯長者資料</h3>
        <div class="space-y-3">
          <div><label class="text-xs text-slate-400">暱稱</label><input id="edit_nickname" value="${p.nickname||''}" class="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-sm text-white"></div>
          <div><label class="text-xs text-slate-400">居住地</label><input id="edit_location" value="${p.location||''}" class="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-sm text-white"></div>
          <div><label class="text-xs text-slate-400">慢性疾病（逗號分隔）</label><input id="edit_diseases" value="${(med.chronic_diseases||[]).join('、')}" class="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-sm text-white"></div>
          <div><label class="text-xs text-slate-400">目前用藥（逗號分隔）</label><input id="edit_meds" value="${(med.current_medications||[]).join('、')}" class="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-sm text-white"></div>
          <div><label class="text-xs text-slate-400">緊急聯絡人</label><input id="edit_ec_name" value="${ec.name||''}" class="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-sm text-white"></div>
          <div><label class="text-xs text-slate-400">聯絡人電話</label><input id="edit_ec_phone" value="${ec.phone||''}" class="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-sm text-white"></div>
        </div>
        <div class="flex justify-end gap-2 mt-5">
          <button onclick="closeEditModal()" class="px-4 py-2 rounded bg-slate-600 text-sm text-white">取消</button>
          <button onclick="saveProfile()" class="px-4 py-2 rounded bg-emerald-500 text-sm text-white font-bold">儲存</button>
        </div>
      </div>
    </div>
  `;
}
function openEditModal() { document.getElementById('editModal').classList.remove('hidden'); }
function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }
async function saveProfile() {
  const data = {
    name: elderData.personal_info?.name || '',
    nickname: document.getElementById('edit_nickname').value.trim(),
    gender: elderData.personal_info?.gender || 'male',
    location: document.getElementById('edit_location').value.trim(),
    chronic_diseases: document.getElementById('edit_diseases').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),
    current_medications: document.getElementById('edit_meds').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),
    ec_name: document.getElementById('edit_ec_name').value.trim(),
    ec_phone: document.getElementById('edit_ec_phone').value.trim(),
    elder_id: elderId
  };
  try {
    await fetch('/api/elder/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    closeEditModal();
    await loadData();
  } catch(e) { alert('儲存失敗'); }
}

// ═══════════════════════════════════════════════════════
// Page: 每日摘要
// ═══════════════════════════════════════════════════════
function renderSummary() {
  if (!elderData) return;
  const s = elderData.today_summary || {};
  const m = s.metrics || {};
  const medByPeriod = m.medication_by_period || {};

  const medIcon = (status) => {
    if (!status) return '<span class="text-slate-500">—</span>';
    if (status.includes('已服藥')) return `<span class="text-emerald-400">✓ ${status}</span>`;
    if (status.includes('未服藥') || status.includes('忘記')) return `<span class="text-red-400">✗ ${status}</span>`;
    return `<span class="text-amber-400">⏳ ${status}</span>`;
  };

  let medHtml = '';
  if (Object.keys(medByPeriod).length > 0) {
    medHtml = Object.entries(medByPeriod).map(([period, status]) => `<div class="pl-4 text-sm">${period} — ${medIcon(status)}</div>`).join('');
  } else {
    medHtml = `<div class="pl-4 text-sm">${m.medication_taken ? '✓ 已服藥' : '未提及'}</div>`;
  }

  document.getElementById('pageContainer').innerHTML = `
    <h2 class="text-lg font-bold mb-4">📋 每日摘要 <span class="text-xs text-slate-400 font-normal">${elderData.report_date || ''}</span></h2>
    <div class="card p-4 mb-3"><p class="text-sm text-slate-300">${s.text || '今天還沒有互動紀錄'}</p></div>
    <div class="space-y-3">
      <div class="card p-4"><div class="text-sm font-bold text-cyan-400 mb-2">🍚 飲食</div><div class="text-sm text-slate-300 pl-4">${m.diet || '未提及'}</div></div>
      <div class="card p-4"><div class="text-sm font-bold text-cyan-400 mb-2">💊 用藥</div>${medHtml}</div>
      <div class="card p-4"><div class="text-sm font-bold text-cyan-400 mb-2">😴 睡眠</div><div class="text-sm text-slate-300 pl-4">${m.sleep || '未提及'}</div></div>
      <div class="card p-4"><div class="text-sm font-bold text-cyan-400 mb-2">🏃 活動</div><div class="text-sm text-slate-300 pl-4">${m.activity || '未提及'}</div></div>
      <div class="card p-4"><div class="text-sm font-bold text-cyan-400 mb-2">🎭 情緒</div><div class="text-sm text-slate-300 pl-4">${m.emotion || '未檢測'}${m.emotion_reason ? ' — ' + m.emotion_reason : ''}</div></div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════
// Page: 情緒趨勢
// ═══════════════════════════════════════════════════════
function renderEmotion() {
  if (!elderData) return;
  const history = elderData.emotion_history || [];
  const latest = history.length > 0 ? history[history.length - 1] : null;
  const emotionIcon = {'開心':'😊','難過':'😢','生氣':'😠','恐懼':'😰','中立':'😐','未檢測':'🔍'}[latest?.emotion] || '🔍';
  const emotionMap = {'開心':5,'吃驚':4,'中立':3,'難過':2,'生氣':1,'恐懼':1,'未檢測':3};

  const recent20 = history.slice(-20);

  document.getElementById('pageContainer').innerHTML = `
    <h2 class="text-lg font-bold mb-4">😊 情緒趨勢</h2>
    <div class="card p-4 mb-4 flex items-center gap-4">
      <div class="text-4xl">${emotionIcon}</div>
      <div><div class="text-lg font-bold text-white">${latest?.emotion || '未檢測'}</div><div class="text-xs text-slate-400">${latest?.reason || ''}</div></div>
    </div>
    <div class="card p-4 mb-4"><canvas id="emotionChart" height="200"></canvas></div>
    <div class="card p-4"><h3 class="text-sm font-bold text-slate-400 mb-3">最近記錄</h3>
      <div class="space-y-2 max-h-64 overflow-y-auto">
        ${recent20.reverse().map(e => `<div class="flex justify-between text-xs py-1 border-b border-slate-700/50"><span class="text-slate-400">${(e.time||'').slice(11,16)}</span><span class="text-white">${e.emotion}</span><span class="text-slate-500">${(e.reason||'').slice(0,20)}</span></div>`).join('')}
      </div>
    </div>
  `;

  // 繪製圖表
  if (recent20.length > 1) {
    const ctx = document.getElementById('emotionChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: recent20.map(e => (e.time||'').slice(11,16)),
        datasets: [{
          label: '情緒',
          data: recent20.map(e => emotionMap[e.emotion] || 3),
          borderColor: '#06b6d4',
          backgroundColor: 'rgba(6,182,212,0.1)',
          fill: true, tension: 0.3, pointRadius: 5
        }]
      },
      options: { responsive: true, scales: { y: { min: 0, max: 6, ticks: { callback: v => ['','恐懼/生氣','難過','中立','吃驚','開心',''][v], color: '#94a3b8' }, grid: { color: '#334155' } }, x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } } }, plugins: { legend: { display: false } } }
    });
  }
}

// ═══════════════════════════════════════════════════════
// Page: 互動統計
// ═══════════════════════════════════════════════════════
function renderStats() {
  if (!elderData) return;
  const stats = elderData.interaction_stats || {};
  const trend = stats.weekly_trend || [];

  document.getElementById('pageContainer').innerHTML = `
    <h2 class="text-lg font-bold mb-4">📊 互動統計</h2>
    <div class="card p-6 mb-4 text-center">
      <div class="text-4xl font-black text-emerald-400">${stats.total_turns || 0}</div>
      <div class="text-sm text-slate-400 mt-1">今日互動次數</div>
    </div>
    <div class="card p-4"><h3 class="text-sm font-bold text-slate-400 mb-3">最近 7 天</h3><canvas id="statsChart" height="200"></canvas></div>
  `;

  if (trend.length > 0) {
    const ctx = document.getElementById('statsChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: trend.map(t => t.day),
        datasets: [{ data: trend.map(t => t.count), backgroundColor: '#10b981', borderRadius: 6 }]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, x: { ticks: { color: '#94a3b8' }, grid: { display: false } } }, plugins: { legend: { display: false } } }
    });
  }
}

// ═══════════════════════════════════════════════════════
// Page: 事件時間軸
// ═══════════════════════════════════════════════════════
const typeIcons = {diet:'🍚',medication:'💊',sleep:'😴',activity:'🏃',emotion:'😊',health:'🏥',social:'👥',cognitive:'🧠',system:'⚙️',other:'📌',interaction:'💬'};
const typeColors = {diet:'bg-amber-500',medication:'bg-emerald-500',sleep:'bg-indigo-500',activity:'bg-orange-500',emotion:'bg-pink-500',health:'bg-red-500',social:'bg-blue-500',cognitive:'bg-purple-500',system:'bg-slate-500',other:'bg-slate-400',interaction:'bg-cyan-500'};
let timelineFilter = null;

function renderTimeline() {
  if (!elderData) return;
  const events = (elderData.timeline_events || []).sort((a,b) => (a.time||'').localeCompare(b.time||''));
  const types = [...new Set(events.map(e => e.type))];
  const filtered = timelineFilter ? events.filter(e => e.type === timelineFilter) : events;

  document.getElementById('pageContainer').innerHTML = `
    <h2 class="text-lg font-bold mb-4">⏱️ 事件時間軸</h2>
    <div class="flex flex-wrap gap-2 mb-4">
      <button class="text-xs px-2 py-1 rounded ${!timelineFilter?'bg-cyan-600 text-white':'bg-slate-700 text-slate-300'}" onclick="timelineFilter=null;renderTimeline()">全部</button>
      ${types.map(t => `<button class="text-xs px-2 py-1 rounded ${timelineFilter===t?'bg-cyan-600 text-white':'bg-slate-700 text-slate-300'}" onclick="timelineFilter='${t}';renderTimeline()">${typeIcons[t]||'📌'} ${t}</button>`).join('')}
    </div>
    <div class="relative pl-6">
      <div class="absolute left-[9px] top-0 bottom-0 w-0.5 bg-slate-700"></div>
      ${filtered.length === 0 ? '<p class="text-sm text-slate-500">今天還沒有事件</p>' : filtered.map(e => `
        <div class="relative mb-4 pl-6">
          <div class="timeline-dot ${typeColors[e.type]||'bg-slate-500'} absolute left-0 top-1.5"></div>
          <div class="text-xs text-slate-400">${(e.time||'').slice(11,16)} ${typeIcons[e.type]||''}</div>
          <div class="text-sm font-bold text-white">${e.title||''}</div>
          <div class="text-xs text-slate-400">${e.description||''}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ═══════════════════════════════════════════════════════
// Page: 提醒事項
// ═══════════════════════════════════════════════════════
function renderReminders() {
  if (!elderData) return;
  document.getElementById('pageContainer').innerHTML = `
    <h2 class="text-lg font-bold mb-4">🔔 提醒事項</h2>
    <div class="mb-4 flex gap-2">
      <input id="newReminderInput" type="text" placeholder="輸入提醒內容（如：下午一點吃藥）" class="flex-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 text-sm text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none">
      <button onclick="addNewReminder()" class="px-4 py-2 rounded-lg bg-emerald-500 text-white text-sm font-bold">+ 新增</button>
    </div>
    <div id="remindersList" class="space-y-2"><p class="text-sm text-slate-500">載入中...</p></div>
  `;
  loadReminders();
}
async function loadReminders() {
  try {
    const resp = await fetch(\`/api/reminders/\${elderId}/pending\`);
    const data = await resp.json();
    const list = document.getElementById('remindersList');
    const reminders = data.reminders || [];
    if (reminders.length === 0) {
      list.innerHTML = '<p class="text-sm text-slate-500">目前沒有待處理的提醒</p>';
      return;
    }
    list.innerHTML = reminders.map(r => \`
      <div class="card p-3 flex justify-between items-center">
        <div><div class="text-sm text-white">\${r.content}</div><div class="text-xs text-slate-500">\${r.created_at?.slice(0,16) || ''}</div></div>
        <span class="text-xs px-2 py-0.5 rounded \${r.status==='pending'?'bg-amber-500/20 text-amber-300':'bg-emerald-500/20 text-emerald-300'}">\${r.status==='pending'?'⏰ 待通知':'✅ 已通知'}</span>
      </div>
    \`).join('');
  } catch(e) { document.getElementById('remindersList').innerHTML = '<p class="text-red-400 text-sm">載入失敗</p>'; }
}
async function addNewReminder() {
  const input = document.getElementById('newReminderInput');
  const content = input.value.trim();
  if (!content) return;
  try {
    await fetch(\`/api/reminders/\${elderId}/add\`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content}) });
    input.value = '';
    loadReminders();
  } catch(e) { alert('新增失敗'); }
}

// ═══════════════════════════════════════════════════════
// Page: 設定
// ═══════════════════════════════════════════════════════
function renderSettings() {
  document.getElementById('pageContainer').innerHTML = `
    <h2 class="text-lg font-bold mb-4">⚙️ 設定</h2>
    <div class="space-y-3">
      <div class="card p-4">
        <h3 class="text-sm font-bold text-cyan-400 mb-3">📌 帳號資訊</h3>
        <div class="text-xs text-slate-400">Elder ID: ${elderId}</div>
        <div class="text-xs text-slate-400 mt-1">暱稱：${elderData?.personal_info?.nickname || ''}</div>
        <div class="mt-3"><button onclick="showResetPin()" class="text-xs px-3 py-1.5 rounded bg-amber-500/20 border border-amber-500/40 text-amber-300 hover:bg-amber-500/30 transition">重設 PIN 碼</button></div>
        <div id="resetPinArea" class="hidden mt-3 space-y-2">
          <input id="new_pin" type="password" inputmode="numeric" maxlength="6" placeholder="新 PIN 碼（4~6 位）" class="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-sm text-white">
          <input id="new_pin_confirm" type="password" inputmode="numeric" maxlength="6" placeholder="確認新 PIN" class="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-sm text-white">
          <button onclick="resetPin()" class="px-4 py-2 rounded bg-emerald-500 text-white text-sm font-bold">確認重設</button>
        </div>
      </div>
      <div class="card p-4">
        <h3 class="text-sm font-bold text-cyan-400 mb-3">🔔 通知偏好</h3>
        <div class="text-xs text-slate-400">LINE 推播：啟用</div>
        <div class="text-xs text-slate-400 mt-1">每日推播時間：19:00</div>
      </div>
      <div class="card p-4">
        <h3 class="text-sm font-bold text-cyan-400 mb-3">📦 資料管理</h3>
        <div class="flex gap-2">
          <button onclick="exportData()" class="text-xs px-3 py-1.5 rounded bg-slate-700 text-slate-300 hover:bg-slate-600 transition">匯出資料（JSON）</button>
          <button onclick="confirmDelete()" class="text-xs px-3 py-1.5 rounded bg-red-500/20 border border-red-500/40 text-red-300 hover:bg-red-500/30 transition">刪除帳號</button>
        </div>
      </div>
      <div class="card p-4">
        <h3 class="text-sm font-bold text-cyan-400 mb-3">ℹ️ 系統資訊</h3>
        <div class="text-xs text-slate-400">版本：1.0.0</div>
        <div class="text-xs text-slate-400 mt-1">語言：繁體中文</div>
        <div class="text-xs text-slate-400 mt-1">AI 模型：Claude Sonnet 4</div>
      </div>
    </div>
  `;
}
function showResetPin() { document.getElementById('resetPinArea').classList.toggle('hidden'); }
async function resetPin() {
  const pin = document.getElementById('new_pin').value.trim();
  const confirm = document.getElementById('new_pin_confirm').value.trim();
  if (!pin || pin.length < 4 || pin.length > 6 || !/^\d+$/.test(pin)) { alert('PIN 碼必須是 4~6 位數字'); return; }
  if (pin !== confirm) { alert('兩次輸入不一致'); return; }
  try {
    await fetch('/api/elder/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ elder_id: elderId, name: elderData.personal_info?.name||'', nickname: elderData.personal_info?.nickname||'', gender: elderData.personal_info?.gender||'male', pin: pin }) });
    alert('PIN 碼已重設！');
    document.getElementById('resetPinArea').classList.add('hidden');
  } catch(e) { alert('重設失敗'); }
}
function confirmDelete() {
  if (confirm('確定要刪除帳號嗎？此操作不可逆！')) {
    if (confirm('再次確認：刪除後所有資料將永久清除。')) {
      localStorage.clear();
      alert('帳號已標記刪除。');
      location.href = 'index.html';
    }
  }
}

function exportData() {
  if (!elderData) return;
  const blob = new Blob([JSON.stringify(elderData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${elderId}_data.json`; a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════
// SSE 即時更新
// ═══════════════════════════════════════════════════════
function connectSSE() {
  try {
    const evtSource = new EventSource('/api/elder/events/stream');
    evtSource.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'summary_updated' || data.type === 'speech_interaction') {
          loadData();  // 重新載入資料
        }
      } catch(e) {}
    };
    evtSource.onerror = () => { setTimeout(connectSSE, 5000); };
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════
loadData();
connectSSE();
</script>
</body>
</html>
