<script>
// ═══════════════════ 角色登入切換邏輯 ═══════════════════
let currentUserId = "";

function selectUser(id, name, imgUrl, defaultEmoji) {

  // 💡 檢查是否有勾選 AI 警語同意書（若未勾選則跳出提示，並中斷登入）
  const agreeCheckbox = document.getElementById('agreeCheckbox');
  if (agreeCheckbox && !agreeCheckbox.checked) {
    alert('請先閱讀並勾選下方的【系統使用須知與隱私保護宣告】，即可開始使用喔！');
    return; // 直接中斷執行，不進入主畫面
  }

  currentUserId = id;
  
  // 1. 將選取的長輩 ID 存入瀏覽器快取 (讓 Dashboard 後台也能讀取當前是誰)
  localStorage.setItem('active_elder_id', id);
  
  // 2. 動態更新對話主畫面的「名稱」與「頭像」
  document.getElementById('mainTitle').textContent = `${name}，今天好嗎？`;
  
  const mainImg = document.getElementById('mainAvatar');
  const mainEmoji = document.getElementById('mainEmoji');
  
  mainImg.src = imgUrl;
  mainImg.onload = () => {
    mainImg.classList.remove('hidden');
    mainEmoji.classList.add('hidden');
  };
  mainImg.onerror = () => {
    // 萬一圖片載入失敗，顯示 Emoji 備份
    mainImg.classList.add('hidden');
    mainEmoji.textContent = defaultEmoji;
    mainEmoji.classList.remove('hidden');
  };

  // 3. 執行淡出效果
  const login = document.getElementById('loginScreen');
  login.style.opacity = '0';
  setTimeout(() => {
    login.classList.add('hidden');
    
    // 4. 顯示語音對話主畫面，並播放淡入動畫
    const app = document.getElementById('mainApp');
    app.classList.remove('hidden');
    app.classList.add('fade-up');
    
    // 5. 💡 【關鍵安全修改】只有等長輩登入後，才真正啟動麥克風監聽！
    initWakeWordDetection();
  }, 500);
}

function logout() {
  // 1. 停止所有當前錄音與語音播放
  stopAll();
  
  // 💡 【新增】重置並隱藏前一位使用者的對話框
  const replyBox = document.getElementById('replyBox');
  const replyText = document.getElementById('replyText');
  if (replyBox) replyBox.style.display = 'none'; // 隱藏對話框
  if (replyText) replyText.textContent = '';     // 清空文字內容
  
  // 隱藏對話主畫面，重置並顯示登入畫面
  document.getElementById('mainApp').classList.add('hidden');
  const login = document.getElementById('loginScreen');
  login.classList.remove('hidden');
  void login.offsetWidth; // 強制重繪以順利套用動畫
  login.style.opacity = '1';
}

// ═══════════════════ VAD 參數設定 ═══════════════════
const THRESHOLD  = 25;    // 音量門檻，防環境雜音
const SILENCE_MS = 1200;  // 靜音幾毫秒後送出
const MIN_MS     = 300;   // 最短有效錄音時間
const MAX_REC_MS = 8000;  // 單次最長錄音（超時強制送出）

// ═══════════════════ 系統狀態 ═══════════════════
let STATE = 'idle';
let stream, audioCtx, analyser, scriptProcessor;
let leftchannel = [], recordingLength = 0;
let silenceTimer = null, startTime = 0, rafId = null;
let maxRecTimeout = null;
let ttsAudio = null;
let sampleRate = 16000;
let recognition = null;
let isSessionActive = false;

const btn      = document.getElementById('btn');
const btnIcon  = document.getElementById('btnIcon');
const btnLabel = document.getElementById('btnLabel');
const status   = document.getElementById('status');
const replyBox = document.getElementById('replyBox');
const replyText= document.getElementById('replyText');

// ═══════════════════ UI 更新 ═══════════════════
function setUI(s) {
  STATE = s;
  const styles = {
    idle:         { bg:'#10b981', anim:'pulse-green 2.5s ease-out infinite', icon:'🎙️', label:'點我開始',  msg:'' },
    waiting_wake: { bg:'#64748b', anim:'pulse-green 2.5s ease-out infinite', icon:'😴', label:'守護中',    msg:'請說「小黃小黃」喚醒' },
    //waiting_wake: { bg:'#64748b', anim:'pulse-green 2.5s ease-out infinite', icon:'😴', label:'守護中',    msg:'請說「小黃小黃」喚醒，或點按鈕開始' },
    listening:    { bg:'#0ea5e9', anim:'pulse-blue 1.5s ease-out infinite',  icon:'👂', label:'在聆聽…',  msg:'👂 請說話，我在聽…' },
    recording:    { bg:'#ef4444', anim:'pulse-red .8s ease-out infinite',    icon:'⏺',  label:'說話中…',  msg:'🔴 正在錄音，請繼續說…' },
    processing:   { bg:'#f59e0b', anim:'none',                               icon:'⏳', label:'思考中…',  msg:'⏳ AI 分析中，請稍候…' },
    speaking:     { bg:'#8b5cf6', anim:'pulse-blue 2s ease-out infinite',    icon:'🔊', label:'回覆中…',  msg:'💬 回覆中，可直接說話打斷' },
  };
  const c = styles[s];
  btn.style.background = c.bg;
  btn.style.animation  = c.anim;
  btnIcon.textContent  = c.icon;
  btnLabel.textContent = c.label;
  status.textContent   = c.msg;
}

// ═══════════════════ 按鈕點擊 ═══════════════════
function onBtnClick() {
  if (STATE === 'waiting_wake' || STATE === 'idle') {
    isSessionActive = true;
    startListening();
  } else {
    stopAll();
  }
}

// ═══════════════════ 喚醒詞監聽 ═══════════════════
function initWakeWordDetection() {
  if (isSessionActive) { startListening(); return; }

  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    isSessionActive = true;
    startListening();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'zh-TW';

  recognition.onstart = () => setUI('waiting_wake');

  recognition.onresult = (event) => {
    if (isSessionActive) return;
    let text = '';
    for (let i = event.resultIndex; i < event.results.length; ++i)
      text += event.results[i][0].transcript;
    if (text.includes('小黃')) {
      isSessionActive = true;
      recognition.stop();
    }
  };

  recognition.onend = () => {
    if (!isSessionActive && STATE === 'waiting_wake') recognition.start();
    else if (isSessionActive) startListening();
  };

  recognition.onerror = () => {};
  recognition.start();
}

// ═══════════════════ 開始錄音 ═══════════════════
async function startListening() {
  try {
    leftchannel = [];
    recordingLength = 0;
    _liveSpeechResult = ''; // 清空即時辨識結果
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass({ sampleRate: 16000 });
    sampleRate = audioCtx.sampleRate;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    scriptProcessor = audioCtx.createScriptProcessor(2048, 1, 1);

    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    analyser.connect(scriptProcessor);
    scriptProcessor.connect(audioCtx.destination);

    scriptProcessor.onaudioprocess = function(e) {
      if (STATE !== 'recording' && STATE !== 'listening') return;
      const samples = e.inputBuffer.getChannelData(0);
      leftchannel.push(new Float32Array(samples));
      recordingLength += samples.length;
    };

    startTime = Date.now();
    setUI('listening');

    // 🎯 同步啟動瀏覽器端即時語音辨識
    startLiveSpeechRecognition();

    clearTimeout(maxRecTimeout);
    maxRecTimeout = setTimeout(() => {
      if (STATE === 'recording' || STATE === 'listening') sendAudio();
    }, MAX_REC_MS);

    rafId = requestAnimationFrame(vadLoop);
  } catch(e) {
    status.textContent = '⚠️ 無法開啟麥克風，請確認權限';
  }
}

// ═══════════════════ VAD 循環 ═══════════════════
function vadLoop() {
  if (STATE === 'processing' || STATE === 'waiting_wake' || STATE === 'idle') return;

  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);
  const vol = buf.reduce((a,b)=>a+b,0) / buf.length;

  if (STATE === 'speaking') { rafId = requestAnimationFrame(vadLoop); return; }

  if (vol > THRESHOLD) {
    if (STATE === 'listening') setUI('recording');
    clearTimeout(silenceTimer);
    silenceTimer = null;
  } else {
    if (STATE === 'recording' && !silenceTimer)
      silenceTimer = setTimeout(sendAudio, SILENCE_MS);
  }
  rafId = requestAnimationFrame(vadLoop);
}

// ═══════════════════ 停止送出 ═══════════════════
function sendAudio() {
  clearTimeout(maxRecTimeout);
  clearTimeout(silenceTimer);
  cancelAnimationFrame(rafId);

  if (Date.now() - startTime < MIN_MS) {
    leftchannel = []; recordingLength = 0;
    setUI('listening');
    rafId = requestAnimationFrame(vadLoop);
    return;
  }

  // 直接呼叫 onStop，資源清理在裡面做
  onStop();
}

// ═══════════════════ WAV 編碼工具 ═══════════════════
function mergeBuffers(ch, len) {
  const result = new Float32Array(len);
  let offset = 0;
  ch.forEach(b => { result.set(b, offset); offset += b.length; });
  return result;
}
function writeUTF(view, off, str) {
  for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
}
function encodeWAV(samples) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buf);
  writeUTF(view, 0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeUTF(view, 8, 'WAVE'); writeUTF(view, 12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  writeUTF(view, 36, 'data'); view.setUint32(40, samples.length * 2, true);
  let idx = 44;
  for (let i = 0; i < samples.length; i++, idx += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(idx, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return view;
}

// ═══════════════════ 送出後端（SSE 串流模式）═══════════════════
// 音訊播放佇列
let audioQueue = [];
let isPlayingQueue = false;

async function onStop() {
  setUI('processing');

  // 📡 通知 Dashboard
  try {
    localStorage.setItem('elder_interaction_event', JSON.stringify({
      time: new Date().toISOString(),
      elder_id: currentUserId,
      state: 'processing'
    }));
  } catch(e) {}

  // 停止錄音相關資源
  clearTimeout(maxRecTimeout);
  clearTimeout(silenceTimer);
  cancelAnimationFrame(rafId);
  if (scriptProcessor) { scriptProcessor.onaudioprocess = null; scriptProcessor.disconnect(); }
  if (stream) stream.getTracks().forEach(t => t.stop());

  // 取得即時 ASR 結果
  const userText = stopLiveSpeechRecognition();
  leftchannel = []; recordingLength = 0;

  if (!userText) {
    // 瀏覽器 ASR 沒抓到文字
    showReply('⚠️ 沒有聽清楚，請再說一次');
    afterSpeak();
    return;
  }

  showReply(`🗣️ ${userText}`);

  // 直接送文字給後端（跳過 86 秒的後端 ASR）
  try {
    await streamChat(userText);
  } catch(err) {
    clearThinking();
    const fallback = '對不起，系統忙碌中，請再試一次';
    showReply(fallback);
    speak(null, fallback);
  }
}

// ═══════ 瀏覽器端即時 ASR（錄音時同步辨識）═══════
let _liveSpeechResult = '';
let _liveSpeechRecognizer = null;

function startLiveSpeechRecognition() {
  _liveSpeechResult = '';
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  _liveSpeechRecognizer = new SpeechRecognition();
  _liveSpeechRecognizer.lang = 'zh-TW';
  _liveSpeechRecognizer.continuous = true;
  _liveSpeechRecognizer.interimResults = true;

  _liveSpeechRecognizer.onresult = (event) => {
    let text = '';
    for (let i = 0; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }
    _liveSpeechResult = text;
  };

  _liveSpeechRecognizer.onerror = () => {};
  _liveSpeechRecognizer.onend = () => {};

  try { _liveSpeechRecognizer.start(); } catch(e) {}
}

function stopLiveSpeechRecognition() {
  if (_liveSpeechRecognizer) {
    try { _liveSpeechRecognizer.stop(); } catch(e) {}
    _liveSpeechRecognizer = null;
  }
  return _liveSpeechResult.trim() || null;
}

// ═══════ 串流對話（只送文字給後端）═══════
async function streamChat(userText) {
  showThinking();
  audioQueue = [];
  isPlayingQueue = false;
  _displayedReply = ''; // 重置累積文字
  setUI('speaking');

  const res = await fetch(`/api/chat/stream?elder_id=${currentUserId}&text=${encodeURIComponent(userText)}`, { method: 'POST' });
  if (!res.ok) throw new Error('後端異常');

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let sseBuffer = '';
  let fullReply = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    sseBuffer += decoder.decode(value, { stream: true });
    const events = sseBuffer.split('\n\n');
    sseBuffer = events.pop();

    for (const eventStr of events) {
      const dataLine = eventStr.split('\n').find(l => l.startsWith('data: '));
      if (!dataLine) continue;

      try {
        const data = JSON.parse(dataLine.slice(6));

        if (data.type === 'thinking') {
          // 只在還沒收到任何句子時才顯示 thinking
          if (fullReply === '') showThinking();
        }
        else if (data.type === 'sentence') {
          fullReply += data.text;
          // 將句子（文字+音訊）加入佇列，由播放器負責同步顯示
          audioQueue.push({ text: data.text, audioUrl: data.audioUrl || null });
          if (!isPlayingQueue) playNextInQueue();
        }
        else if (data.type === 'done') {
          fullReply = data.full_reply || fullReply;

          try {
            localStorage.setItem('elder_interaction_event', JSON.stringify({
              time: new Date().toISOString(),
              elder_id: currentUserId,
              user_text: userText,
              ai_reply: fullReply,
              state: 'completed'
            }));
          } catch(e) {}

          if (['再見','拜拜','不需要了'].some(w => fullReply.includes(w))) {
            isSessionActive = false;
          }
        }
      } catch(e) {}
    }
  }

  await waitForQueueEmpty();
  // 播放全部結束後顯示完整回覆
  showReply(fullReply);
  afterSpeak();
}

// ═══════════════════ 音訊佇列播放器 ═══════════════════
let _displayedReply = ''; // 追蹤已顯示的累積文字

function playNextInQueue() {
  if (audioQueue.length === 0) {
    isPlayingQueue = false;
    return;
  }
  isPlayingQueue = true;

  // 開始播放第一句時，清除「思考中」動畫
  clearThinking();

  const item = audioQueue.shift();

  // 播放這句時，同步顯示對應的文字
  _displayedReply += item.text;
  showReply(_displayedReply);

  if (item.audioUrl) {
    ttsAudio = new Audio(item.audioUrl);
    ttsAudio.onended = () => {
      ttsAudio = null;
      playNextInQueue();
    };
    ttsAudio.onerror = () => {
      ttsAudio = null;
      playNextInQueue();
    };
    ttsAudio.play().catch(() => {
      ttsAudio = null;
      playNextInQueue();
    });
  } else {
    // 沒有音訊 URL，用瀏覽器 TTS 或直接跳下一句
    if (window.speechSynthesis && item.text) {
      const utt = new SpeechSynthesisUtterance(item.text);
      utt.lang = 'zh-TW';
      utt.rate = 0.95;
      utt.onend = () => playNextInQueue();
      utt.onerror = () => playNextInQueue();
      speechSynthesis.speak(utt);
    } else {
      playNextInQueue();
    }
  }
}

function waitForQueueEmpty() {
  return new Promise(resolve => {
    const check = () => {
      if (audioQueue.length === 0 && !isPlayingQueue) {
        resolve();
      } else {
        setTimeout(check, 200);
      }
    };
    check();
  });
}

// ═══════════════════ 顯示回應 ═══════════════════
let _isShowingThinking = false;

function showReply(text) {
  // 確保先停止 thinking 動畫
  clearThinking();
  replyText.textContent = text;
  replyBox.style.display = 'block';
}

// 思考中動畫：顯示動態三點
let _thinkingTimer = null;
function showThinking() {
  // 避免重複建立 timer
  if (_thinkingTimer) return;
  _isShowingThinking = true;
  replyBox.style.display = 'block';
  let dots = 0;
  const labels = ['思考中', '思考中．', '思考中．．', '思考中．．．'];
  replyText.textContent = labels[0];
  _thinkingTimer = setInterval(() => {
    dots = (dots + 1) % labels.length;
    replyText.textContent = labels[dots];
  }, 400);
}

function clearThinking() {
  if (_thinkingTimer) {
    clearInterval(_thinkingTimer);
    _thinkingTimer = null;
  }
  _isShowingThinking = false;
}

// ═══════════════════ TTS ═══════════════════
function speak(audioUrl, fallbackText) {
  setUI('speaking');
  rafId = requestAnimationFrame(vadLoop);

  const url = audioUrl || `/api/tts?text=${encodeURIComponent(fallbackText)}`;
  ttsAudio = new Audio(url);
  ttsAudio.onended = afterSpeak;
  ttsAudio.onerror = () => fallbackSpeak(fallbackText);
  ttsAudio.play().catch(() => fallbackSpeak(fallbackText));
}

function fallbackSpeak(text) {
  if (!window.speechSynthesis) { afterSpeak(); return; }
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'zh-TW'; utt.rate = 0.95;
  utt.onend = afterSpeak; utt.onerror = afterSpeak;
  speechSynthesis.speak(utt);
}

// ═══════════════════ 對話結束 ═══════════════════
function afterSpeak() {
  cancelAnimationFrame(rafId);
  audioCtx?.close(); audioCtx = null;
  setUI('idle');
  if (isSessionActive) setTimeout(startListening, 1000);
  else setTimeout(initWakeWordDetection, 1000);
}

function stopAll() {
  isSessionActive = false;
  clearTimeout(maxRecTimeout);
  if (recognition) recognition.stop();
  
  // 清空音訊佇列
  audioQueue = [];
  isPlayingQueue = false;
  
  // 💡 【強化】徹底停止 HTML5 Audio 的播放與釋放記憶體
  if (ttsAudio) { 
    ttsAudio.pause(); 
    ttsAudio.currentTime = 0; // 將進度條歸零，確保徹底中斷
    ttsAudio = null; 
  }
  
  // 💡 【新增】強制中斷瀏覽器內建 Web Speech TTS 的發音
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel(); 
  }

  clearTimeout(silenceTimer);
  cancelAnimationFrame(rafId);
  if (scriptProcessor) { scriptProcessor.onaudioprocess = null; scriptProcessor.disconnect(); }
  if (stream) stream.getTracks().forEach(t => t.stop());
  audioCtx?.close(); audioCtx = null;
  leftchannel = []; recordingLength = 0;
  setUI('idle');
  status.textContent = '已停止';
  setTimeout(() => { if (STATE === 'idle') status.textContent = ''; }, 2000);
}

// 💡 預設不執行初始化，等待點選使用者後才啟動！
setUI('idle');
</script>
